name: Secret scan (reusable)

# Shared TruffleHog secret scan for every velocity-exchange repo. Callers supply
# a `pull_request` trigger and nothing else; the scan logic lives here once so
# nine repos can't drift into nine different tunings.
#
#   jobs:
#     secret-scan:
#       uses: velocity-exchange/shared-workflows/.github/workflows/secret-scan-reusable.yml@master
#
# This repo is PUBLIC on purpose. A public repo cannot consume a reusable
# workflow from a private one, and the org is on the Team plan so `internal`
# visibility does not exist - hosting here is the only arrangement that works
# for public and private callers alike.
#
# Scope is the PR range only (merge-base..head), never full history. The org's
# repos were swept once at adoption and came back clean, so this exists to stop
# the next leak rather than re-litigate the last one. Full-history sweeps stay a
# manual local operation - slow, and only needed again after a rewrite.
#
# Three tiers, deliberately:
#   verified -> the candidate was replayed against the issuing provider and it
#               authenticated. False positives are impossible by construction,
#               so this fails the job (unless fail_on_verified: false).
#   unknown  -> a candidate matched but verification could not conclude (provider
#               4xx/5xx, no egress). Annotated, never blocking.
#   keypair  -> a 64-byte array that looks like a Solana keypair, from the custom
#               detector in the second pass below. Unverifiable by nature and
#               shape-identical to a signature, so annotated, never blocking.
#
# `unverified` is deliberately NOT requested. There the provider actively said
# the credential is dead, and asking for that tier produced 36 lockfile-hash
# matches across this org's repos at zero signal - the fastest way to train
# everyone to ignore this job.
#
# Findings are reported as detector + location ONLY. Never echo a matched value:
# workflow logs are readable by anyone with repo read access, so printing a live
# credential turns one leak into two.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. velocity-v1 and friends use plain `ubicloud`.
        required: false
        type: string
        default: ubicloud-standard-8
      fail_on_verified:
        description: >-
          Fail the job when a credential authenticates against its provider.
          Set false for an annotate-only rollout - which also stops a crashed
          scan from failing, so the job is then genuinely non-blocking.
          (`continue-on-error` is not a supported key on a job that calls a
          reusable workflow, hence this input.)
        required: false
        type: boolean
        default: true

# Deliberately NOT inputs: the TruffleHog version, the result tiers, and the Wit
# exclusion. Those are the same correct answer in every repo, and an input per
# knob is how nine repos end up with nine tunings and no shared baseline.

permissions:
  contents: read

concurrency:
  # Keyed by repository too - the same group name across callers would have
  # repos cancelling each other's scans.
  group: secret-scan-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ${{ inputs.runner }}
    steps:
      # Every step below reads github.event.pull_request. Under any other trigger
      # those are empty, the range collapses, and the scan would report a
      # confident green having looked at nothing.
      #
      # pull_request_target is rejected on purpose, not by omission: scanning
      # requires checking out PR code, and doing that under
      # pull_request_target's privileged token is the classic critical Actions
      # vulnerability. The workflow-tampering risk that trigger would solve is
      # instead covered by CODEOWNERS review on .github/.
      - name: Require a pull_request event
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error title=Secret scan misconfigured::This reusable workflow only supports callers triggered by \`pull_request\` (got '${EVENT_NAME}'). Under any other trigger it would scan an empty range and report success."
            exit 1
          fi

      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Scan the branch as authored, not the synthetic merge commit that
          # `pull_request` checks out by default.
          ref: ${{ github.event.pull_request.head.sha }}
          # fetch-depth: 0 brings every branch and tag, so both the base tip and
          # the merge base are present locally and the range below needs no
          # authenticated fetch of its own.
          fetch-depth: 0
          # Nothing here pushes or fetches again, and TruffleHog reads the repo's
          # full history - so don't leave a usable token in .git/config while it
          # runs.
          persist-credentials: false

      - name: Install TruffleHog
        env:
          # Pinned by version AND digest: the upstream install script curls from
          # `main`, which is an unpinned dependency in a job whose whole purpose
          # is handling credentials.
          VERSION: 3.97.1
          SHA256: f863ea3a8d786f7d097870496c977944cce7372a2fe1e56707d965016e543ece
        run: |
          set -euo pipefail
          # The digest above is the linux/amd64 asset. A caller passing an arm64
          # runner label would otherwise fail as a confusing checksum mismatch.
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "::error title=Secret scan runner mismatch::Expected an x86_64 runner, got ${arch}. Either pass an x86_64 `runner` input, or add the matching TruffleHog asset digest here."
            exit 1
          fi
          tarball="trufflehog_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" trufflehog
          install -m 0755 "${RUNNER_TEMP}/trufflehog" /usr/local/bin/trufflehog

      - name: Resolve scan range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # base.sha is the base branch tip as of the last sync, which is not
          # necessarily an ancestor of head - the base branch moves, and either
          # side can be force-pushed. The merge base is the commit this PR
          # actually diverged from, so it is the only correct floor. Using
          # base.sha directly would silently skip commits whenever the base
          # branch had advanced.
          if base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            echo "since_commit=${base}" >> "$GITHUB_OUTPUT"
          else
            # Erring toward over-scanning: a missing merge base must not become
            # "scanned nothing, reported clean".
            echo "::warning title=Secret scan range::No merge base for ${BASE_SHA}...${HEAD_SHA}; scanning the full branch history instead."
            echo "since_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan pull request commits
        id: scan
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SINCE_COMMIT: ${{ steps.range.outputs.since_commit }}
        run: |
          set -uo pipefail
          args=(
            git "file://${PWD}"
            --branch "$HEAD_SHA"
            --results=verified,unknown
            # Wit matches Solana's System Program ID - the all-1s base58 pubkey
            # present in every Solana codebase - and wit.ai answers 400, so it can
            # neither verify nor clear: a permanent `unknown` on every single run.
            # Nobody here uses Meta's NLP service, so this costs no coverage.
            --exclude-detectors=Wit
            --no-update
            --json
            --concurrency=8
          )
          if [ -n "$SINCE_COMMIT" ]; then
            args+=(--since-commit "$SINCE_COMMIT")
          fi

          set +e
          trufflehog "${args[@]}" > "${RUNNER_TEMP}/raw.jsonl" 2> "${RUNNER_TEMP}/scan.log"
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

          # stdout carries one JSON object per result, but keep only real results
          # so a stray log line can never be counted as a finding.
          jq -c 'select(type == "object" and ((.DetectorName // "") | length > 0))' \
            < "${RUNNER_TEMP}/raw.jsonl" > "${RUNNER_TEMP}/findings.jsonl" \
            || : > "${RUNNER_TEMP}/findings.jsonl"

          echo "--- TruffleHog scan log (tail) ---"
          tail -n 20 "${RUNNER_TEMP}/scan.log" || true

      # Second pass, isolated on purpose.
      #
      # A raw Solana keypair is a 64-element byte array. It matches no built-in
      # detector, and it carries no provider vocabulary for TruffleHog's keyword
      # prefilter to latch onto - so the adoption sweep was blind to it, and did
      # in fact miss committed (dead, localnet) keypairs in one of these repos.
      #
      # There is nothing to verify a keypair against, so these results land in
      # the `unverified` tier that pass 1 deliberately drops. Running the custom
      # detector ALONE (--include-detectors=CustomRegex) is what lets us ask for
      # that tier here without dragging lockfile-hash noise back in.
      #
      # The config is written inline rather than committed: this workflow runs
      # with the CALLER's repo checked out, so a file living in this repo
      # would not be on disk.
      - name: Scan for Solana keypairs
        id: keypair
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SINCE_COMMIT: ${{ steps.range.outputs.since_commit }}
        run: |
          set -uo pipefail
          cat > "${RUNNER_TEMP}/keypair-detector.yaml" <<'YAML'
          detectors:
            - name: solana-keypair-bytes
              keywords:
                - "["
              regex:
                keypair: '\[\s*(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\s*(?:,\s*(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\s*){63}\]'
          YAML

          args=(
            git "file://${PWD}"
            --branch "$HEAD_SHA"
            --config "${RUNNER_TEMP}/keypair-detector.yaml"
            --include-detectors=CustomRegex
            --results=verified,unknown,unverified
            --no-update
            --json
            --concurrency=8
          )
          if [ -n "$SINCE_COMMIT" ]; then
            args+=(--since-commit "$SINCE_COMMIT")
          fi

          set +e
          trufflehog "${args[@]}" > "${RUNNER_TEMP}/raw-keypair.jsonl" 2> "${RUNNER_TEMP}/keypair.log"
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

          jq -c 'select(type == "object" and ((.DetectorName // "") | length > 0))' \
            < "${RUNNER_TEMP}/raw-keypair.jsonl" > "${RUNNER_TEMP}/keypair.jsonl" \
            || : > "${RUNNER_TEMP}/keypair.jsonl"

          echo "--- keypair pass log (tail) ---"
          tail -n 5 "${RUNNER_TEMP}/keypair.log" || true

      - name: Report findings
        env:
          SCAN_RC: ${{ steps.scan.outputs.rc }}
          KEYPAIR_RC: ${{ steps.keypair.outputs.rc }}
          FAIL_ON_VERIFIED: ${{ inputs.fail_on_verified }}
        run: |
          set -euo pipefail
          findings="${RUNNER_TEMP}/findings.jsonl"

          # Without --fail (unused here, so the two tiers can be split) TruffleHog
          # exits 0 whether or not it found anything. Any other code means the scan
          # itself broke - which leaves an empty findings file that is
          # indistinguishable from "clean". A crashed scanner must not report green.
          if [ "$SCAN_RC" != "0" ]; then
            echo "::error title=Secret scan did not complete::TruffleHog exited ${SCAN_RC}. This run proves nothing about the PR; see the scan log in the previous step."
            # Spelled out rather than `[ ... ] && exit 1`: that form only works
            # under `set -e` because of the &&-list exemption, and reads like a
            # bug waiting to be tidied into one.
            if [ "$FAIL_ON_VERIFIED" = "true" ]; then
              exit 1
            fi
            exit 0
          fi

          # Detector + location only. No .Raw, ever.
          fmt='"\(.DetectorName) - \(.SourceMetadata.Data.Git.file // "?"):\(.SourceMetadata.Data.Git.line // 0) @ \((.SourceMetadata.Data.Git.commit // "????????")[0:8])"'

          # Deduplicate before counting, not after: TruffleHog reports the same
          # secret once per commit that touched the file, so raw result counts
          # inflate a single leak into "9 credentials" and make the summary lie.
          jq -rs ".[] | select(.Verified == true) | ${fmt}" "$findings" | sort -u > "${RUNNER_TEMP}/verified.txt"
          jq -rs ".[] | select(.Verified != true) | ${fmt}" "$findings" | sort -u > "${RUNNER_TEMP}/unknown.txt"
          verified="$(wc -l < "${RUNNER_TEMP}/verified.txt" | tr -d '[:space:]')"
          unknown="$(wc -l < "${RUNNER_TEMP}/unknown.txt" | tr -d '[:space:]')"

          if [ "$unknown" -gt 0 ]; then
            while IFS= read -r line; do
              echo "::warning title=Unverified credential candidate::${line}"
            done < "${RUNNER_TEMP}/unknown.txt"
          fi

          # Third tier: possible Solana keypairs. Warn-only, always - there is
          # nothing to verify them against, and a 64-byte *signature* serialised
          # as a byte array is shape-identical to a keypair, so this tier has a
          # real false-positive floor that no regex can remove. Blocking on it
          # would burn the credibility the zero-noise tuning above buys.
          # The custom detector reports as DetectorName "CustomRegex"; its real
          # name is only in ExtraData.name.
          keypair_fmt='"\(.ExtraData.name // "custom") - \(.SourceMetadata.Data.Git.file // "?"):\(.SourceMetadata.Data.Git.line // 0) @ \((.SourceMetadata.Data.Git.commit // "????????")[0:8])"'
          if [ "$KEYPAIR_RC" != "0" ]; then
            echo "::warning title=Keypair scan did not complete::The Solana keypair pass exited ${KEYPAIR_RC}; that tier is advisory, so this does not fail the job - but it also did not run."
            : > "${RUNNER_TEMP}/keypair.txt"
          else
            jq -rs ".[] | ${keypair_fmt}" "${RUNNER_TEMP}/keypair.jsonl" | sort -u > "${RUNNER_TEMP}/keypair.txt"
          fi
          keypairs="$(wc -l < "${RUNNER_TEMP}/keypair.txt" | tr -d '[:space:]')"

          if [ "$keypairs" -gt 0 ]; then
            while IFS= read -r line; do
              echo "::warning title=Possible Solana keypair::${line}"
            done < "${RUNNER_TEMP}/keypair.txt"
            echo "::warning title=Review the keypair candidates::${keypairs} 64-byte array(s) added in this PR look like Solana keypairs. Often a signature or test fixture - but if any is a real key, the public key is the LAST 32 bytes (base58) and rotation is required, since deleting the commit does not revoke it."
          fi

          if [ "$verified" -gt 0 ]; then
            while IFS= read -r line; do
              echo "::error title=Live credential committed::${line}"
            done < "${RUNNER_TEMP}/verified.txt"
            echo "::error title=Secret scan failed::${verified} credential(s) in this PR authenticated against their provider. ROTATE THEM FIRST - deleting the commit does not revoke anything - then reference them via ExternalSecrets or Secrets Manager instead of committing the value."
            if [ "$FAIL_ON_VERIFIED" = "true" ]; then
              exit 1
            fi
            echo "::warning title=Secret scan not enforcing::fail_on_verified is false, so this run is advisory and did not block the merge."
            exit 0
          fi

          echo "No live credentials found in this pull request's commits."
          echo "Unverified candidates annotated: ${unknown}."
          echo "Possible Solana keypairs annotated: ${keypairs}."
